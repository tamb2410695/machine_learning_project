decision_tree_regressor:
  id: dt_r
  name: Decision Tree Regressor
  enabled: true
  task: regression
  estimator: DecisionTreeRegressor
  params:
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    criterion: squared_error

random_forest_regressor:
  id: rf_r
  name: Random Forest Regressor
  enabled: true
  task: regression
  estimator: RandomForestRegressor
  params:
    n_estimators: 100
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: 1.0
    random_state: 42

k_nearest_neighbors_regressor:
  id: knn_r
  name: K-Nearest Neighbors Regressor
  enabled: true
  task: regression
  estimator: KNeighborsRegressor
  params:
    n_neighbors: 5
    weights: uniform
    p: 2

linear_regression:
  id: lr
  name: Linear Regression
  enabled: true
  task: regression
  estimator: LinearRegression
  params: {}

ridge_regressor:
  id: ridge
  name: Ridge Regression
  enabled: true
  task: regression
  estimator: Ridge
  params:
    alpha: 1.0

gaussian_naive_bayes:
  id: gnb
  name: Gaussian Naive Bayes
  enabled: false
  task: classification
  estimator: GaussianNB
  params:
    var_smoothing: 1.0e-9

adaboost_regressor:
  id: ada_reg
  name: AdaBoostRegressor
  enabled: true
  task: regression
  estimator: AdaBoostRegressor
  params:
    n_estimators: 50
    learning_rate: 1.0
    estimator: null