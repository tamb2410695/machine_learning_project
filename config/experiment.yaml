A_full_dataset_temp:
  dataset_key: kerala_house_price
  task: regression
  target: price
  features:
    numeric:
    categorical:

  preprocessing:
    clean:
      enabled: true
      missing_values:
        strategy_numeric: [median]
        strategy_categorical: [most_frequent]
      duplicates:
        enabled: true
        keep: [first]

    split:
      # Note: We create a product and do not allow null values for holdout or CV.
      # A parameter combination of null-null can run, but it contains no data.
      # An explanation will be provided for this case.
      holdout: [null, 0.2, 0.3, 0.4]
      cv: [null, 5, 6, 7, 8]

    transform:
      # Create ColumnTransformer for Pipline
      enabled: true
      numeric:
        impute:
        scaler: [standard, minmax]
      categorical:
        impute:
        encoder: [one_hot]

  models:
    - decision_tree_regressor: {}
    - random_forest_regressor: {}
    - k_nearest_neighbors_regressor: {}
    - linear_regression: {}
    - bagging_regressor:
      estimator:
        - decision_tree_regressor
        - random_forest_regressor
        - k_nearest_neighbors_regressor
      parameter_grid:
        n_estimators: [10, 20, 50]
        max_samples: [0.7, 1.0]

A_full_dataset:
  dataset_key: kerala_house_price
  task: regression
  target: price
  features:
    numeric:
    categorical:

  preprocessing:
    clean:
      enabled: true
      missing_values:
        strategy_numeric: [median]
        strategy_categorical: [most_frequent]
      duplicates:
        enabled: true
        keep: [first, last]

    split:
      # Note: We create a product and do not allow null values for holdout or CV.
      # A parameter combination of null-null can run, but it contains no data.
      # An explanation will be provided for this case.
      holdout: [null, 0.2, 0.3, 0.4]
      cv: [null, 5, 6, 7, 8]

    transform:
      # Create ColumnTransformer for Pipline
      enabled: true
      numeric:
        impute: [null]
        scaler: [standard, minmax]
      categorical:
        impute: [null]
        encoder: [one_hot]

  models:
    - decision_tree_regressor: {}
    - random_forest_regressor: {}
    - k_nearest_neighbors_regressor: {}
    - linear_regression: {}
    - bagging_regressor:
      estimator:
        - decision_tree_regressor
        - random_forest_regressor
        - k_nearest_neighbors_regressor
      parameter_grid:
        n_estimators: [10, 20, 50]
        max_samples: [0.7, 1.0]

  runs:
    - name: baseline
      overrides: {}
    - names: clean_disabled
      overrides:
        preprocessing:
          clean:
            enabled: false
    - names: duplicates_disabled
      overrides:
        preprocessing:
          clean:
            duplicates:
              enabled: false
    - names: transform_disabled
      overrides:
        preprocessing:
          transform:
            enabled: false

